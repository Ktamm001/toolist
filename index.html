<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minu töölist</title>
<meta name="theme-color" content="#eef1f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Töölist">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0 }
[hidden] { display: none !important }
.backup { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap }
.backup button, .backup label { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 14px; cursor: pointer }
.backup input { display: none }
/* Layout: one narrow column, add-bar on top, filter chips, list of rows with large tap targets */
:root {
  --bg: #eef1f3; --surface: #ffffff; --ink: #18222b; --muted: #5d6b77; --line: #d6dde2;
  --work: #2453c9; --work-soft: #e3eafb; --idea: #b7790b; --idea-soft: #fbf0d6; --done: #2f8a57;
  --danger: #b4322a;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171c; --surface: #1b2229; --ink: #e8edf1; --muted: #93a1ad; --line: #2c3640;
  --work: #7fa2ff; --work-soft: #1f2a45; --idea: #f0b84a; --idea-soft: #3a2e14; --done: #5cc58a;
  --danger: #ff7b70; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171c; --surface: #1b2229; --ink: #e8edf1; --muted: #93a1ad; --line: #2c3640;
  --work: #7fa2ff; --work-soft: #1f2a45; --idea: #f0b84a; --idea-soft: #3a2e14; --done: #5cc58a;
  --danger: #ff7b70; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 18px }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap }
h1 { font-family: var(--display); font-weight: 800; font-size: 2rem; letter-spacing: -0.02em; margin: 0; text-wrap: balance }
.count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .95rem }
form.add { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 10px }
.add-row { display: flex; gap: 8px }
#newText { flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; color: var(--ink); background: transparent; border: 0; padding: 10px 8px; outline: none }
.add-btn { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 0 18px; background: var(--ink); color: var(--bg); cursor: pointer; min-height: 46px }
.kinds { display: flex; gap: 6px }
.kind { font: inherit; font-size: .9rem; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 14px; cursor: pointer }
.kind[aria-pressed="true"][data-k="töö"] { background: var(--work-soft); border-color: var(--work); color: var(--work); font-weight: 700 }
.kind[aria-pressed="true"][data-k="idee"] { background: var(--idea-soft); border-color: var(--idea); color: var(--idea); font-weight: 700 }
.filters { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; overflow-x: auto }
.filters button { flex: 1; font: inherit; font-size: .92rem; border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 8px 6px; cursor: pointer; white-space: nowrap }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700 }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: flex-start; gap: 12px; padding: 12px 10px 12px 12px }
li.idee { border-left: 4px solid var(--idea) } li.töö { border-left: 4px solid var(--work) }
.check { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; cursor: pointer; display: grid; place-items: center; margin-top: 1px; color: var(--surface) }
li.done .check { background: var(--done); border-color: var(--done) }
.check svg { width: 16px; height: 16px; opacity: 0 } li.done .check svg { opacity: 1 }
.body { flex: 1; min-width: 0 }
.text { overflow-wrap: anywhere; font-size: 1.02rem }
li.done .text { text-decoration: line-through; color: var(--muted) }
.meta { font-size: .8rem; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap }
.tag { text-transform: uppercase; letter-spacing: .06em; font-weight: 700 }
li.idee .tag { color: var(--idea) } li.töö .tag { color: var(--work) }
.del { flex: none; border: 0; background: transparent; color: var(--muted); cursor: pointer; font: inherit; font-size: .85rem; padding: 4px 6px; border-radius: 6px; min-height: 32px }
.del.armed { color: #fff; background: var(--danger) }
button:focus-visible, input:focus-visible { outline: 2px solid var(--work); outline-offset: 2px }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; border: 1.5px dashed var(--line); border-radius: 14px }
.empty strong { display: block; color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 1.15rem; margin-bottom: 4px }
.note { font-size: .85rem; color: var(--muted); text-align: center }
.note.warn { color: var(--danger) }
.clear { justify-self: center; font: inherit; font-size: .88rem; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 14px; cursor: pointer }
@media (prefers-reduced-motion: no-preference) { li { transition: opacity .2s } }
.opts { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; justify-content: space-between }
.prios { display: flex; gap: 4px }
.prio-btn { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 5px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px }
.prio-btn[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 700 }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none }
.p1 .dot, .dot.p1 { background: var(--danger) } .p2 .dot, .dot.p2 { background: var(--idea) } .p3 .dot, .dot.p3 { background: var(--muted) }
.due-field { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted) }
#newDue { font: inherit; font-size: .9rem; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; min-height: 34px }
.chip { position: relative; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; background: transparent; color: var(--muted); font: inherit; font-size: .78rem; cursor: pointer; font-variant-numeric: tabular-nums }
.chip input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; font-size: 16px }
.chip.overdue { border-color: var(--danger); color: var(--danger); font-weight: 700 }
.chip.soon { border-color: var(--idea); color: var(--idea); font-weight: 700 }
li.done .chip { border-color: var(--line); color: var(--muted); font-weight: 400 }
.meta { align-items: center }

/* Launch splash: logo draws itself, then the list appears */
#splash { position: fixed; inset: 0; z-index: 100; background: #18222b; display: grid; place-items: center; transition: opacity .4s ease, visibility .4s; cursor: pointer }
#splash.out { opacity: 0; visibility: hidden }
.splash-in { display: grid; justify-items: center; gap: 14px }
#splash svg { width: 132px; height: 132px; overflow: visible }
#splash .ring { fill: none; stroke-width: 2.6; stroke-dasharray: 44; stroke-dashoffset: 44; animation: draw .45s ease-out forwards }
#splash .bar { stroke-width: 5; stroke-linecap: round; stroke-dasharray: 42; stroke-dashoffset: 42; animation: draw .5s cubic-bezier(.3,.7,.3,1) forwards }
#splash .fill { fill: #5cc58a; transform-origin: 27px 30px; transform: scale(0); animation: pop .3s cubic-bezier(.3,1.6,.5,1) .85s forwards }
#splash .tick { fill: none; stroke: #18222b; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14; stroke-dashoffset: 14; animation: draw .25s ease-out 1.05s forwards }
#splash .word { font-family: var(--display); font-weight: 800; font-size: 1.9rem; letter-spacing: -0.02em; color: #e8edf1; opacity: 0; transform: translateY(8px); animation: rise .45s ease-out 1s forwards }
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes pop { to { transform: scale(1) } }
@keyframes rise { to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) {
  #splash .ring, #splash .bar, #splash .tick { animation: none; stroke-dashoffset: 0 }
  #splash .fill { animation: none; transform: none }
  #splash .word { animation: none; opacity: 1; transform: none }
}
</style>

</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-in">
    <svg viewBox="0 0 100 100">
      <circle class="ring" cx="27" cy="30" r="7" stroke="#5cc58a"/>
      <circle class="fill" cx="27" cy="30" r="7.5"/>
      <path class="tick" d="M23.6 30.2l2.4 2.6 4.6-5"/>
      <circle class="ring" cx="27" cy="50" r="7" stroke="#7fa2ff" style="animation-delay:.12s"/>
      <circle class="ring" cx="27" cy="70" r="7" stroke="#f0b84a" style="animation-delay:.24s"/>
      <line class="bar" x1="41" y1="30" x2="80" y2="30" stroke="#93a1ad" style="animation-delay:.3s"/>
      <line class="bar" x1="41" y1="50" x2="71" y2="50" stroke="#e8edf1" style="animation-delay:.42s"/>
      <line class="bar" x1="41" y1="70" x2="80" y2="70" stroke="#e8edf1" style="animation-delay:.54s"/>
    </svg>
    <div class="word">Töölist</div>
  </div>
</div>
<div class="wrap">
  <header>
    <h1>Minu töölist</h1>
    <span class="count" id="count"></span>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <div class="add-row">
      <input id="newText" type="text" placeholder="Uus töö või idee…" maxlength="500" aria-label="Uus kirje">
      <button class="add-btn" type="submit">Lisa</button>
    </div>
    <div class="kinds" role="group" aria-label="Tüüp">
      <button type="button" class="kind" data-k="töö" aria-pressed="true">Töö</button>
      <button type="button" class="kind" data-k="idee" aria-pressed="false">Idee</button>
    </div>
    <div class="opts">
      <div class="prios" role="group" aria-label="Prioriteet">
        <button type="button" class="prio-btn p1" data-p="1" aria-pressed="false"><span class="dot"></span>Kõrge</button>
        <button type="button" class="prio-btn p2" data-p="2" aria-pressed="true"><span class="dot"></span>Keskmine</button>
        <button type="button" class="prio-btn p3" data-p="3" aria-pressed="false"><span class="dot"></span>Madal</button>
      </div>
      <label class="due-field" for="newDue">Tähtaeg <input id="newDue" type="date"></label>
    </div>
  </form>

  <nav class="filters" aria-label="Filter">
    <button type="button" data-f="open" aria-pressed="true">Tegemata</button>
    <button type="button" data-f="töö" aria-pressed="false">Tööd</button>
    <button type="button" data-f="idee" aria-pressed="false">Ideed</button>
    <button type="button" data-f="done" aria-pressed="false">Tehtud</button>
    <button type="button" data-f="all" aria-pressed="false">Kõik</button>
  </nav>

  <ul id="list"></ul>
  <div class="empty" id="empty"><strong>Nimekiri on tühi</strong>Kirjuta ülal lahtrisse töö või idee ja vajuta „Lisa“. Ringile toksates märgid selle tehtuks.</div>
  <button type="button" class="clear" id="clearDone" hidden>Kustuta kõik tehtud</button>
  <p class="note" id="note">Laen…</p>
  <div class="backup">
    <button type="button" id="exportBtn">Salvesta varukoopia</button>
    <label for="importFile">Taasta varukoopiast</label>
    <input type="file" id="importFile" accept="application/json,.json">
  </div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
  let prio = 2;
  const PRIO = { 1: "Kõrge", 2: "Keskmine", 3: "Madal" };
  const pOf = i => (i.prio === 1 || i.prio === 3) ? i.prio : 2;
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const dayDiff = s => Math.round((new Date(s + "T00:00:00") - new Date(today() + "T00:00:00")) / 864e5);
  const dueLabel = s => {
    const n = dayDiff(s);
    if (n === 0) return "täna";
    if (n === 1) return "homme";
    if (n === -1) return "eile";
    if (n < 0) return `${-n} päeva üle`;
    return new Date(s + "T00:00:00").toLocaleDateString("et-EE", { day: "numeric", month: "short" });
  };
  let items = [], kind = "töö", filter = "open", armed = null, armTimer = null;
  try { filter = localStorage.getItem("todo-filter") || "open"; } catch (e) {}

  const fmt = ts => {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleDateString("et-EE", { day: "numeric", month: "short" });
  };

  function render() {
    document.querySelectorAll(".filters button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));
    const open = items.filter(i => !i.done);
    $("#count").textContent = items.length ? `${open.length} tegemata · ${items.length - open.length} tehtud` : "";
    let shown = items.filter(i =>
      filter === "all" ? true : filter === "done" ? i.done : filter === "open" ? !i.done : (i.kind === filter && !i.done));
    shown.sort((a, b) => (a.done - b.done)
      || (filter === "done" ? (b.doneAt || 0) - (a.doneAt || 0)
        : (pOf(a) - pOf(b)) || ((a.due || "9999") < (b.due || "9999") ? -1 : (a.due || "9999") > (b.due || "9999") ? 1 : 0) || (b.createdAt || 0) - (a.createdAt || 0)));
    const ul = $("#list"); ul.textContent = "";
    for (const it of shown) {
      const li = document.createElement("li");
      li.className = (it.kind === "idee" ? "idee" : "töö") + (it.done ? " done" : "");
      const c = document.createElement("button");
      c.className = "check"; c.type = "button"; c.innerHTML = CHECK;
      c.setAttribute("aria-label", it.done ? "Märgi tegemata" : "Märgi tehtuks");
      c.onclick = () => save(it.id, { done: !it.done, doneAt: it.done ? null : Date.now() });
      const body = document.createElement("div"); body.className = "body";
      const t = document.createElement("div"); t.className = "text"; t.textContent = it.text;
      const m = document.createElement("div"); m.className = "meta";
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = it.kind === "idee" ? "Idee" : "Töö";
      const dt = document.createElement("span");
      dt.textContent = it.done && it.doneAt ? `tehtud ${fmt(it.doneAt)}` : `lisatud ${fmt(it.createdAt)}`;
      const p = pOf(it);
      const pc = document.createElement("button");
      pc.type = "button"; pc.className = "chip p" + p;
      pc.innerHTML = '<span class="dot"></span>';
      pc.append(PRIO[p]);
      pc.setAttribute("aria-label", `Prioriteet ${PRIO[p]}, toksa muutmiseks`);
      pc.onclick = () => save(it.id, { prio: p === 1 ? 2 : p === 2 ? 3 : 1 });
      const dc = document.createElement("label");
      dc.className = "chip";
      if (it.due && !it.done) { const n = dayDiff(it.due); if (n < 0) dc.classList.add("overdue"); else if (n <= 1) dc.classList.add("soon"); }
      dc.append(it.due ? "⏱ " + dueLabel(it.due) : "+ tähtaeg");
      const di = document.createElement("input");
      di.type = "date"; di.value = it.due || ""; di.setAttribute("aria-label", "Tähtaeg");
      di.onchange = () => save(it.id, { due: di.value || null });
      dc.append(di);
      m.append(tag, pc, dc, dt); body.append(t, m);
      const d = document.createElement("button");
      d.className = "del" + (armed === it.id ? " armed" : ""); d.type = "button";
      d.textContent = armed === it.id ? "Kustuta?" : "✕";
      d.setAttribute("aria-label", "Kustuta");
      d.onclick = () => {
        if (armed === it.id) { armed = null; remove(it.id); return; }
        armed = it.id; clearTimeout(armTimer); armTimer = setTimeout(() => { armed = null; render(); }, 3000); render();
      };
      li.append(c, body, d); ul.append(li);
    }
    const emp = $("#empty");
    emp.hidden = shown.length > 0;
    if (!shown.length && items.length) emp.innerHTML = "<strong>Siin pole midagi</strong>Vali teine filter või lisa uus kirje.";
    else if (!items.length) emp.innerHTML = "<strong>Nimekiri on tühi</strong>Kirjuta ülal lahtrisse töö või idee ja vajuta „Lisa“. Ringile toksates märgid selle tehtuks.";
    $("#clearDone").hidden = !(filter === "done" && shown.length);
  }

  // Storage: this device only
  const local = {
    load() { try { return JSON.parse(localStorage.getItem("todo-items") || "[]"); } catch (e) { return []; } },
    store() { try { localStorage.setItem("todo-items", JSON.stringify(items)); } catch (e) {} }
  };
  const note = (msg, warn) => { const n = $("#note"); n.textContent = msg; n.classList.toggle("warn", !!warn); };

  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  function add(text) {
    const due = $("#newDue").value || null;
    $("#newDue").value = "";
    items.push({ id: newId(), text, kind, prio, due, done: false, createdAt: Date.now(), doneAt: null });
    local.store(); render();
  }
  function save(id, patch) { items = items.map(i => i.id === id ? { ...i, ...patch } : i); local.store(); render(); }
  function remove(id) { items = items.filter(i => i.id !== id); local.store(); render(); }

  $("#exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify({ app: "toolist", version: 1, items }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `toolist-${today()}.json`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    note("Varukoopia salvestati allalaadimiste kausta.");
  };
  $("#importFile").onchange = async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const incoming = Array.isArray(data) ? data : data.items;
      if (!Array.isArray(incoming)) throw new Error();
      const byId = new Map(items.map(i => [i.id, i]));
      let n = 0;
      for (const it of incoming) if (it && typeof it.text === "string") { byId.set(it.id || newId(), { ...it, id: it.id || newId() }); n++; }
      items = [...byId.values()]; local.store(); render();
      note(`Taastatud ${n} kirjet.`);
    } catch (err) { note("See fail ei ole töölisti varukoopia.", true); }
  };

  $("#addForm").addEventListener("submit", e => {
    e.preventDefault();
    const inp = $("#newText"); const text = inp.value.trim();
    if (!text) { inp.focus(); return; }
    inp.value = ""; add(text); inp.focus();
  });
  document.querySelectorAll(".kind").forEach(b => b.onclick = () => {
    kind = b.dataset.k;
    document.querySelectorAll(".kind").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  document.querySelectorAll(".prio-btn").forEach(b => b.onclick = () => {
    prio = Number(b.dataset.p);
    document.querySelectorAll(".prio-btn").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  document.querySelectorAll(".filters button").forEach(b => b.onclick = () => {
    filter = b.dataset.f; try { localStorage.setItem("todo-filter", filter); } catch (e) {} render();
  });
  $("#clearDone").onclick = async (ev) => {
    const btn = ev.currentTarget;
    if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Kinnita: kustuta kõik tehtud"; setTimeout(() => { btn.dataset.armed = ""; btn.textContent = "Kustuta kõik tehtud"; }, 3000); return; }
    btn.dataset.armed = ""; btn.textContent = "Kustuta kõik tehtud";
    items = items.filter(i => !i.done); local.store(); render();
  };

  render();

  items = local.load(); render();
  note("Kirjed salvestuvad selles seadmes. Tee aeg-ajalt varukoopia.");
  (() => {
    const sp = $("#splash");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const hide = () => { sp.classList.add("out"); setTimeout(() => sp.remove(), 450); };
    const t = setTimeout(hide, reduce ? 700 : 2300);
    sp.addEventListener("click", () => { clearTimeout(t); hide(); }, { once: true });
  })();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
